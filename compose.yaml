services:
  fridge.api:
    image: fridge.api
    depends_on:
      - database
      - service-bus
    environment:
      - ASPNETCORE_HTTP_PORTS=8081
      - ConnectionStrings__Database=$FRIDGE_DATABASE_CONNECTION_STRING
      
      - JwtConfiguration__Authority=$JWT_AUTHORITY
      - JwtConfiguration__Audience=$JWT_AUDIENCE
      - JwtConfiguration__SecurityKey=$JWT_SECURITY_KEY
      
      - MINIO_ROOT_USER=$MINIO_ACCESS_KEY
      - MINIO_ROOT_PASSWORD=$MINIO_SECRET_KEY
      - MINIO_ENDPOINT_EXTERNAL=$MINIO_ENDPOINT_EXTERNAL
      - MINIO_ENDPOINT_PORT_EXTERNAL=$MINIO_ENDPOINT_PORT_EXTERNAL 
      - MINIO_ENDPOINT=$MINIO_ENDPOINT
      - MINIO_ENDPOINT_PORT=$MINIO_ENDPOINT_PORT
      - MINIO_ACCESS_KEY=$MINIO_ACCESS_KEY
      - MINIO_SECRET_KEY=$MINIO_SECRET_KEY
      - MINIO_USE_SSL=$MINIO_USE_SSL
      - MINIO_BUCKET_NAME=$MINIO_BUCKET_NAME

      - ServiceBusSettings__Username=$SERVICE_BUS_USERNAME
      - ServiceBusSettings__Password=$SERVICE_BUS_PASSWORD
      - ServiceBusSettings__Port=$SERVICE_BUS_PORT
      - ServiceBusSettings__Hostname=$SERVICE_BUS_HOSTNAME
        
      - OPEN_API__KEY=$OPEN_API__KEY
      - OPEN_API__ASSISTANT_NAME=$OPEN_API__ASSISTANT_NAME
      - OPEN_API__ASSISTANT_INSTRUCTIONS=$OPEN_API__ASSISTANT_INSTRUCTIONS
    ports:
      - $FRIDGE_API_EXTERNAL_PORT:8081
    build:
      context: .
      dockerfile: src/Presentation/Fridge.API/Dockerfile
    networks:
      default:

  statistic.api:
    image: statistic.api
    depends_on:
      service-bus:
        condition: service_healthy
      database:
          condition: service_started
          
    environment:
      - ASPNETCORE_HTTP_PORTS=8082

      - ConnectionStrings__Database=$STATISTIC_DATABASE_CONNECTION_STRING

      - JwtConfiguration__Authority=$JWT_AUTHORITY
      - JwtConfiguration__Audience=$JWT_AUDIENCE
      - JwtConfiguration__SecurityKey=$JWT_SECURITY_KEY
      
      - ServiceBusSettings__Username=$SERVICE_BUS_USERNAME
      - ServiceBusSettings__Password=$SERVICE_BUS_PASSWORD
      - ServiceBusSettings__Port=$SERVICE_BUS_PORT
      - ServiceBusSettings__Hostname=$SERVICE_BUS_HOSTNAME
      
      - NATIONAL_FOOD_WASTE_INDEX=$NATIONAL_FOOD_WASTE_INDEX
    ports:
      - $STATISTIC_API_EXTERNAL_PORT:8082
    build:
      context: .
      dockerfile: src/Presentation/Statistic.API/Dockerfile
    networks:
      default:
      
  user.service:
    image: user.service
    depends_on:
      - database
    environment:
      - ASPNETCORE_HTTP_PORTS=8083
      - ConnectionStrings__Database=$USER_DATABASE_CONNECTION_STRING
      - DEFAULT_ADMIN_USER=$DEFAULT_ADMIN_USER
      - DEFAULT_ADMIN_PASSWORD=$DEFAULT_ADMIN_PASSWORD
    ports:
      - $USER_API_EXTERNAL_PORT:8083
    build:
      context: .
      dockerfile: src/Presentation/Identity/User.Service/Dockerfile
    networks:
      default:

  plan.service:
    image: plan.service
    depends_on:
      - database
    environment:
      - ASPNETCORE_HTTP_PORTS=8084
      - ConnectionStrings__Database=$PLAN_DATABASE_CONNECTION_STRING
    ports:
      - $PLAN_API_EXTERNAL_PORT:8084
    build:
      context: .
      dockerfile: src/Presentation/Identity/Plan.Service/Dockerfile
    networks:
      default:

  identity.api:
    image: identity.api
    depends_on:
      - database
    environment:
      - ASPNETCORE_HTTP_PORTS=8085
      - ConnectionStrings__UserService=$CONNECTION_STRINGS_USERSERVICE
      - JwtConfiguration__Issuer=$JWT_ISSUER
      - JwtConfiguration__Authority=$JWT_AUTHORITY
      - JwtConfiguration__Audience=$JWT_AUDIENCE
      - JwtConfiguration__SecurityKey=$JWT_SECURITY_KEY
      - JwtConfiguration__ExpirationTimeInMinutes=$JWT_EXPIRATION_TIME_IN_MINUTES
    ports:
      - $IDENTITY_API_EXTERNAL_PORT:8085
    build:
      context: .
      dockerfile: src/Presentation/Identity/Identity.API/Dockerfile
    networks:
      default:

