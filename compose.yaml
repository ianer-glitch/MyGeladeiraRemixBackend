  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: always
    environment:
      SA_PASSWORD: $MSSQL_SA_PASSWORD
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    volumes:
      - ./volumes/mssql:/var/opt/mssql
    ports:
      - 5011:1433
    networks:
      default:
  
  service-bus:
    image: rabbitmq:3-management-alpine
    environment:
      - RABBITMQ_DEFAULT_USER=$SERVICE_BUS_USERNAME
      - RABBITMQ_DEFAULT_PASS=$SERVICE_BUS_PASSWORD
    ports:
      - 5004:5672
      - 5005:15672
    
    healthcheck:
        test: [ "CMD", "rabbitmqctl", "status" ]
        interval: 10s
        timeout: 5s
        retries: 5
        
    volumes:
      - ./volumes/ServiceBus/data/:/var/lib/rabbitmq/
      - ./volumes/ServiceBus/log/:/var/log/rabbitmq
    
    networks:
      default:
    
      
        
  
  file.storage.service:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "8086:8086"
      - $MINIO_ENDPOINT_PORT_EXTERNAL:9000
    environment:
      - MINIO_ROOT_USER=$MINIO_ACCESS_KEY
      - MINIO_ROOT_PASSWORD=$MINIO_SECRET_KEY
      - MINIO_ENDPOINT=$MINIO_ENDPOINT
      - MINIO_ENDPOINT_PORT=$MINIO_ENDPOINT_PORT
      - MINIO_ACCESS_KEY=$MINIO_ACCESS_KEY
      - MINIO_SECRET_KEY=$MINIO_SECRET_KEY
      - MINIO_USE_SSL=$MINIO_USE_SSL
      - MINIO_BUCKET_NAME=$MINIO_BUCKET_NAME
    volumes:
      - ./volumes/minio:/var/lib/minio/data
    command: server /data --console-address ":8086"
    networks:
      default:
networks:
  default:
    driver: "bridge"